---
# Build and test every pushed commit once. See CI.md.
name: CI

on:
  # Push only, all branches: a pushed commit's checks show on its PR, so a pull_request
  # trigger would only run the same commit again.
  push:
    branches: ['**']

permissions:
  contents: read
  actions: read # to look up earlier runs of this commit

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # One run per commit: end here when this commit already has a successful run of this
      # workflow (e.g. a branch created at an already checked commit, or a re-run of a green run).
      - name: Skip if this commit already has a green run
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf="${GITHUB_WORKFLOW_REF%@*}"; wf="${wf##*/}"
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0].html_url // empty") \
            || { echo "::warning::Could not query earlier runs; running the full job"; prev=""; }
          if [ -z "$prev" ] && [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            for ((a = 1; a < GITHUB_RUN_ATTEMPT; a++)); do
              c=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$a" --jq '.conclusion // empty') || c=""
              if [ "$c" = success ]; then prev="attempt $a of this run"; break; fi
            done
          fi
          if [ -n "$prev" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit $GITHUB_SHA already has a green run: $prev. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No earlier green run of $GITHUB_SHA; running the full job."
          fi

      # The default checkout sets origin to the GitHub URL, which InfoProviderTest needs.
      - name: Checkout
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Dependency cache (actions cache, not artifact storage). The project's own artifacts,
      # installed by this build, are left out.
      - name: Cache Maven dependencies
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/de/symeda
          key: ${{ runner.os }}-jdk21-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk21-m2-

      # Testcontainers 1.18.3 (HistoryTablesTest) asks Docker for API 1.32 unless told otherwise;
      # Docker 29 refuses anything below 1.44 and the test is then skipped silently. 1.44 is
      # accepted by Docker 25 and later.
      - name: Docker API version for Testcontainers
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          docker version --format 'Docker server {{.Server.Version}}, API {{.Server.APIVersion}}, minimum API {{.Server.MinAPIVersion}}'
          echo "api.version=1.44" > "$HOME/.docker-java.properties"
          java -version 2>&1 | head -1
          mvn -v | head -1

      # The production frontend build of sormas-ui checks the Vaadin commercial licence (Rich Text
      # Editor): the CI server key comes from the repository secret, as VAADIN_OFFLINE_KEY. Never echo it.
      - name: Build and test (mvn clean install, default profiles)
        if: steps.dedupe.outputs.skip != 'true'
        working-directory: sormas-base
        env:
          VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_PRODMODE_CI_SERVER_KEY }}
        run: |
          [ -n "$VAADIN_OFFLINE_KEY" ] || echo "::warning::VAADIN_OFFLINE_KEY is empty (repository secret VAADIN_PRODMODE_CI_SERVER_KEY missing): the sormas-ui production frontend build fails its Vaadin licence check"
          mvn -B -ntp clean install

      # Test counts per module in the job summary; fails when HistoryTablesTest did not run.
      - name: Test report
        if: ${{ !cancelled() && steps.dedupe.outputs.skip != 'true' }}
        run: |
          python3 - <<'EOF'
          import glob, os, sys, xml.etree.ElementTree as ET
          keys = ('tests', 'failures', 'errors', 'skipped')
          totals, history = {}, None
          for f in sorted(glob.glob('*/target/surefire-reports/TEST-*.xml')):
              root = ET.parse(f).getroot()
              vals = [int(float(root.get(k, 0))) for k in keys]
              mod = totals.setdefault(f.split('/')[0], [0, 0, 0, 0])
              for i, v in enumerate(vals):
                  mod[i] += v
              if root.get('name', '').endswith('.HistoryTablesTest'):
                  history = vals
          lines = ['### Tests', '', '| Module | Run | Failures | Errors | Skipped |', '|---|---|---|---|---|']
          lines += ['| %s | %d | %d | %d | %d |' % (m, *v) for m, v in sorted(totals.items())]
          lines.append('| **Total** | %d | %d | %d | %d |' % tuple(sum(v[i] for v in totals.values()) for i in range(4)))
          ok = history is not None and history[0] > 0 and history[3] == 0 and history[1] + history[2] == 0
          lines += ['', 'HistoryTablesTest (Testcontainers): %s' % ('ran, passed' if ok else 'NOT RUN, SKIPPED OR FAILED: %s' % (history,))]
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write(text)
          if not ok:
              print('::error::HistoryTablesTest did not run and pass (Docker not usable by Testcontainers?)')
              sys.exit(1)
          EOF

      # Smoke, in this job on the artefacts just built: start one app copy with env/, log in as each
      # web test user, stop the copy. See CI.md and env/README.md ("Smoke check").
      #
      # NON-BLOCKING until ticket 1a-91 (migration stage 1a): env/ runs Payara 7 (Jakarta EE 11) on
      # JDK 21 since 1a-22, but the app is still being ported to Jakarta EE and does not deploy on it
      # until 1a-91, so the app does not come up. The logins run only when the start succeeded.
      # Every smoke step has continue-on-error: its result shows in the log and the job stays green.
      # 1a-91 removes continue-on-error again (CI.md "Smoke").
      #
      # env/up.sh --no-build reuses the image and env/.state/build/deploy only; it cannot take the
      # target/ directories of this build (without them it would build the app a second time). This
      # step puts this build's artefacts where env/build.sh would and builds the same Payara image.
      # Keep it in step with env/build.sh (collect and image).
      - name: 'Smoke: env/ artefacts and Payara image from this build'
        continue-on-error: true # non-blocking until 1a-91, see above
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          source env/lib.sh
          D=$APP_ENV_DEPLOY_DIR
          mkdir -p "$D/apps" "$D/setup" "$BUILD_DIR/dl" "$BUILD_DIR/ctx"
          cp sormas-ear/target/sormas-ear.ear sormas-ui/target/sormas-ui.war sormas-rest/target/sormas-rest.war "$D/apps/"
          cp sormas-base/setup/{sormas.properties,logback.xml,loginsidebar.html,loginsidebar-header.html,logindetails.html,loginmain.html} "$D/setup/"
          cat sormas-base/setup/sormas.properties env/sormas.properties.env > "$D/sormas.properties"
          mvn -B -ntp -q -f sormas-serverlibs/pom.xml -DincludeScope=compile -DoutputDirectory="$D/serverlibs" dependency:copy-dependencies
          git rev-parse HEAD > "$D/commit"
          ZIP=$BUILD_DIR/dl/payara-$PAYARA_VERSION.zip
          curl -sSfL -o "$ZIP" "$PAYARA_ZIP_URL"
          [ "$(sha1sum < "$ZIP" | cut -c1-40)" = "$(curl -sSfL "$PAYARA_ZIP_URL.sha1" | cut -c1-40)" ] || { echo "::error::Payara zip sha1 mismatch"; exit 1; }
          cp env/payara/{Dockerfile,payara-setup.sh,entrypoint.sh} "$BUILD_DIR/ctx/"
          mv "$ZIP" "$BUILD_DIR/ctx/payara.zip"
          docker build -q -t "$APP_ENV_IMAGE" "$BUILD_DIR/ctx"
          ls -l "$D/apps"; echo "server libs: $(find "$D/serverlibs" -name "*.jar" | wc -l)"

      - name: 'Smoke: Node 22'
        continue-on-error: true # non-blocking until 1a-91, see above
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 'Smoke: Playwright 1.63 and Chromium'
        continue-on-error: true # non-blocking until 1a-91, see above
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          npm install -g --no-fund --no-audit playwright@1.63.0
          playwright install --with-deps chromium

      # One copy with the env/ defaults (port 18080, project sormas-new-env): start, seed, snapshot.
      - name: 'Smoke: start the app (env/up.sh --no-build)'
        continue-on-error: true # non-blocking until 1a-91, see above
        id: smoke_up
        if: steps.dedupe.outputs.skip != 'true'
        # Until 1a-91 the app never answers: wait 5 min, not the default 15
        env:
          APP_ENV_WAIT_S: '300'
        run: env/up.sh --no-build

      # Each web test user logs in and the first view loads with no console error and no HTTP >= 400;
      # PoeInf is refused. Passwords are read from DefaultEntityHelper.java, never printed or written.
      - name: 'Smoke: log in as each web test user'
        continue-on-error: true # non-blocking until 1a-91, see above
        id: smoke_login
        if: steps.dedupe.outputs.skip != 'true' && steps.smoke_up.outcome == 'success'
        run: node env/smoke.cjs env/.state/smoke

      # Always, also on failure or cancel, once the start step has run.
      - name: 'Smoke: app log, stop the app (env/down.sh)'
        continue-on-error: true # non-blocking until 1a-91, see above
        if: ${{ always() && steps.smoke_up.outcome != 'skipped' && steps.dedupe.outputs.skip != 'true' }}
        run: |
          source env/lib.sh
          mkdir -p env/.state/smoke
          docker logs "$APP_ENV_CONTAINER" > env/.state/smoke/app.log 2>&1 || true
          env/down.sh

      # Until 1a-91: the smoke result as a warning and in the job summary, since it cannot fail the job.
      - name: 'Smoke: result (non-blocking until 1a-91)'
        if: ${{ always() && steps.dedupe.outputs.skip != 'true' }}
        env:
          UP: ${{ steps.smoke_up.outcome }}
          LOGIN: ${{ steps.smoke_login.outcome }}
        run: |
          msg="Smoke (non-blocking until 1a-91, the app does not deploy on Payara 7 before it): start $UP, logins $LOGIN"
          echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$UP" != success ] || [ "$LOGIN" != success ]; then echo "::warning::$msg"; fi

      # Diagnostics only on failure; never artefacts. continue-on-error so a full storage quota
      # never turns a result red. The smoke files hold no passwords: screenshots (the password field
      # is masked), smoke.json and the app's server log. env/.state/ is a hidden directory, which
      # upload-artifact skips unless include-hidden-files is set.
      - name: Upload diagnostics
        if: ${{ failure() && steps.dedupe.outputs.skip != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            */target/surefire-reports/
            */target/*.log
            env/.state/smoke/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
