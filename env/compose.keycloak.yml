# Opt-in: APP_ENV_AUTH=keycloak adds this file to the copy (env/lib.sh). A local Keycloak 21.1.2 (the version of the
# app's Keycloak libraries, keycloak.version in sormas-base/pom.xml) with the repository's SORMAS realm, the SORMAS
# login theme and the sormas-sha256 password hash provider. Test environments only: development mode, H2 database in
# the container, generated secrets. Nothing outside this host is contacted. See env/README.md "Keycloak".
#
# The app container shares the Keycloak container's network: Keycloak answers on localhost:$APP_ENV_KC_PORT both in the
# browser on this host and in the app (provider URI, token check, user sync), so every token names one issuer, as
# behind one public host name in production. The app's port is therefore published by the keycloak service.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.2
    container_name: ${APP_ENV_PROJECT}-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=${APP_ENV_KC_PORT:?}
      - --http-relative-path=/keycloak
      - --health-enabled=true
    env_file:
      # generated by up.sh (mode 600): admin password and client secrets, SORMAS_SERVER_URL for the realm's placeholders
      - path: ${APP_ENV_COPY_DIR:?}/kc.env
        required: false
    volumes:
      # the realm (stock SORMAS.json, rootUrl http instead of https as docs/SERVER_SETUP.md says for servers without SSL)
      - ${APP_ENV_COPY_DIR}/kc-realm:/opt/keycloak/data/import:ro
      - ${APP_ENV_DEPLOY_DIR:?}/keycloak/themes/sormas:/opt/keycloak/themes/sormas:ro
      - ${APP_ENV_DEPLOY_DIR}/keycloak/providers:/opt/keycloak/providers:ro
    ports:
      - "127.0.0.1:${APP_ENV_KC_PORT}:${APP_ENV_KC_PORT}"
      - "127.0.0.1:${APP_ENV_PORT:?}:4880"
    networks:
      - default
    healthcheck:
      # the image has no curl: plain HTTP over bash; ready once the realm is imported and the server listens
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${APP_ENV_KC_PORT} && printf 'GET /keycloak/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 100
    labels:
      sormas-env.project: ${APP_ENV_PROJECT}

  app:
    network_mode: service:keycloak
    ports: !reset []
    env_file:
      # the Keycloak settings of keycloak-setup.sh (provider URI, client ids and secrets), read through MicroProfile Config (up.sh)
      - path: ${APP_ENV_COPY_DIR}/kc-app.env
        required: false
    depends_on:
      keycloak:
        condition: service_healthy
