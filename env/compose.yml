# One app copy. Run through env/up.sh, env/reset.sh and env/down.sh (they set the variables below), not directly.
# Project name = APP_ENV_PROJECT: network <project>_default, volume <project>_dbdata, containers named per copy.
name: ${APP_ENV_PROJECT:?}

services:
  db:
    image: postgres:14
    container_name: ${APP_ENV_PROJECT}-db
    env_file:
      # optional only so that down.sh works when up.sh never got this far; up.sh always writes it
      - path: ${APP_ENV_COPY_DIR:?}/db.env
        required: false
    environment:
      TZ: Europe/Berlin
    command: ["postgres", "-c", "max_connections=288", "-c", "max_prepared_transactions=256"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/db-init.sh:/docker-entrypoint-initdb.d/10-sormas.sh:ro
    healthcheck:
      # sormas_db exists only once the init script has run
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sormas_db", "-h", "127.0.0.1"]
      interval: 2s
      retries: 60
    labels:
      sormas-env.project: ${APP_ENV_PROJECT}

  mail:
    # SMTP sink: accepts every mail on port 1025 and keeps it; web UI and API on 8025 (published on 127.0.0.1 only)
    image: axllent/mailpit:v1.27
    container_name: ${APP_ENV_PROJECT}-mail
    ports:
      - "127.0.0.1:${APP_ENV_MAIL_PORT:-}:8025"
    labels:
      sormas-env.project: ${APP_ENV_PROJECT}

  app:
    image: ${APP_ENV_IMAGE:?}
    container_name: ${APP_ENV_CONTAINER:?}
    # An init process as PID 1 reaps the Payara JVM after a domain stop (reset.sh); without it the stop waits 60 s
    init: true
    env_file:
      - path: ${APP_ENV_COPY_DIR}/db.env
        required: false
    environment:
      SORMAS_DB_HOST: db
      TZ: Europe/Berlin
    volumes:
      - ${APP_ENV_DEPLOY_DIR:?}:/deploy:ro
    ports:
      - "127.0.0.1:${APP_ENV_PORT:?}:4880"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    labels:
      sormas-env.project: ${APP_ENV_PROJECT}

volumes:
  dbdata:
