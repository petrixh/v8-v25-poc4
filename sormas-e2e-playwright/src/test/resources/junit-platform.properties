# Workflow test classes run in parallel, one app copy each (e2e.ports sets how many copies); the steps of a class run
# in order on one thread. Classes wait for a free copy (AppCopyPool), so the parallelism is the number of copies.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=custom
junit.jupiter.execution.parallel.config.custom.class=de.symeda.sormas.e2e.playwright.support.CopiesParallelism
junit.jupiter.testclass.order.default=de.symeda.sormas.e2e.playwright.support.KindOrder
